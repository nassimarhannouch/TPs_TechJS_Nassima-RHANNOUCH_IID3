<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reading Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center text-blue-600 mb-8">📚 Book Reading Tracker</h1>
        
        <!-- Global Statistics -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4 text-gray-800">Statistiques Globales</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-blue-50 p-4 rounded-lg">
                    <p class="text-gray-600">Total de livres</p>
                    <p id="totalBooks" class="text-3xl font-bold text-blue-600">0</p>
                </div>
                <div class="bg-green-50 p-4 rounded-lg">
                    <p class="text-gray-600">Livres terminés</p>
                    <p id="finishedBooks" class="text-3xl font-bold text-green-600">0</p>
                </div>
                <div class="bg-purple-50 p-4 rounded-lg">
                    <p class="text-gray-600">Pages totales lues</p>
                    <p id="totalPages" class="text-3xl font-bold text-purple-600">0</p>
                </div>
            </div>
        </div>

        <!-- Add Book Form -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4 text-gray-800">Ajouter un Livre</h2>
            <form id="bookForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 mb-2">Titre *</label>
                    <input type="text" id="title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2">Auteur *</label>
                    <input type="text" id="author" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2">Nombre de pages *</label>
                    <input type="number" id="numberOfPages" required min="1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2">Pages lues</label>
                    <input type="number" id="pagesRead" value="0" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2">Statut *</label>
                    <select id="status" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Want to read">Want to read</option>
                        <option value="Currently reading">Currently reading</option>
                        <option value="Read">Read</option>
                        <option value="Re-read">Re-read</option>
                        <option value="DNF">DNF</option>
                        <option value="Returned Unread">Returned Unread</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 mb-2">Format *</label>
                    <select id="format" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Print">Print</option>
                        <option value="PDF">PDF</option>
                        <option value="Ebook">Ebook</option>
                        <option value="AudioBook">AudioBook</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 mb-2">Prix (€)</label>
                    <input type="number" id="price" value="0" min="0" step="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2">Suggéré par</label>
                    <input type="text" id="suggestedBy" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition duration-200 font-semibold">
                        Ajouter le Livre
                    </button>
                </div>
            </form>
        </div>

        <!-- Books List -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-semibold mb-4 text-gray-800">Mes Livres</h2>
            <div id="booksList" class="space-y-4">
            </div>
        </div>
    </div>

    <script>
        let books = [];

        function loadBooks() {
            const savedBooks = localStorage.getItem('books');
            if (savedBooks) {
                books = JSON.parse(savedBooks);
                displayBooks();
                updateStats();
            }
        }

        function saveBooks() {
            localStorage.setItem('books', JSON.stringify(books));
        }

        document.getElementById('bookForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const numberOfPages = parseInt(document.getElementById('numberOfPages').value);
            const pagesRead = parseInt(document.getElementById('pagesRead').value);
            
            const book = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                numberOfPages: numberOfPages,
                pagesRead: Math.min(pagesRead, numberOfPages),
                status: document.getElementById('status').value,
                format: document.getElementById('format').value,
                price: parseFloat(document.getElementById('price').value),
                suggestedBy: document.getElementById('suggestedBy').value,
                finished: pagesRead >= numberOfPages
            };
            
            books.push(book);
            saveBooks();
            displayBooks();
            updateStats();
            this.reset();
        });

        function displayBooks() {
            const booksList = document.getElementById('booksList');
            
            if (books.length === 0) {
                booksList.innerHTML = '<p class="text-gray-500 text-center py-8">Aucun livre ajouté. Commencez par ajouter votre premier livre!</p>';
                return;
            }
            
            booksList.innerHTML = books.map((book, index) => {
                const percentage = Math.round((book.pagesRead / book.numberOfPages) * 100);
                const statusColor = book.finished ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                
                return `
                    <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition duration-200">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex-1">
                                <h3 class="text-xl font-semibold text-gray-800">${book.title}</h3>
                                <p class="text-gray-600">par ${book.author}</p>
                            </div>
                            <button onclick="deleteBook(${index})" class="text-red-500 hover:text-red-700 px-3 py-1 rounded">
                                🗑️
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3 text-sm">
                            <div>
                                <span class="text-gray-600">Format:</span> 
                                <span class="font-medium">${book.format}</span>
                            </div>
                            <div>
                                <span class="text-gray-600">Prix:</span> 
                                <span class="font-medium">${book.price}€</span>
                            </div>
                            <div>
                                <span class="text-gray-600">Pages:</span> 
                                <span class="font-medium">${book.pagesRead}/${book.numberOfPages}</span>
                            </div>
                            <div>
                                <span class="${statusColor} px-2 py-1 rounded text-xs">${book.status}</span>
                            </div>
                        </div>
                        
                        ${book.suggestedBy ? `<p class="text-sm text-gray-600 mb-3">Suggéré par: ${book.suggestedBy}</p>` : ''}
                        
                        <div class="mb-2">
                            <div class="flex justify-between text-sm mb-1">
                                <span class="text-gray-600">Progression</span>
                                <span class="font-semibold ${book.finished ? 'text-green-600' : 'text-blue-600'}">${percentage}%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-3">
                                <div class="h-3 rounded-full ${book.finished ? 'bg-green-500' : 'bg-blue-500'}" style="width: ${percentage}%"></div>
                            </div>
                        </div>
                        
                        ${!book.finished ? `
                            <div class="mt-3 flex gap-2">
                                <input type="number" id="updatePages${index}" placeholder="Pages lues" min="0" max="${book.numberOfPages}" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm">
                                <button onclick="updatePages(${index})" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 text-sm">
                                    Mettre à jour
                                </button>
                            </div>
                        ` : '<p class="text-green-600 font-semibold mt-2">✓ Livre terminé!</p>'}
                    </div>
                `;
            }).join('');
        }

        function updatePages(index) {
            const input = document.getElementById(`updatePages${index}`);
            const newPages = parseInt(input.value);
            
            if (newPages >= 0 && newPages <= books[index].numberOfPages) {
                books[index].pagesRead = newPages;
                books[index].finished = newPages === books[index].numberOfPages;
                saveBooks();
                displayBooks();
                updateStats();
            }
        }

        // Delete book
        function deleteBook(index) {
            if (confirm('Êtes-vous sûr de vouloir supprimer ce livre?')) {
                books.splice(index, 1);
                saveBooks();
                displayBooks();
                updateStats();
            }
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalBooks').textContent = books.length;
            document.getElementById('finishedBooks').textContent = books.filter(b => b.finished).length;
            document.getElementById('totalPages').textContent = books.reduce((sum, b) => sum + b.pagesRead, 0);
        }

        // Load books on page load
        loadBooks();
    </script>
</body>
</html>
