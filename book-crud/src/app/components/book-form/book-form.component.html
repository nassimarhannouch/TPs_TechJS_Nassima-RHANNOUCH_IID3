<h2>{{ bookId ? 'Edit Book' : 'Add Book' }}</h2>

<form [formGroup]="bookForm" (ngSubmit)="submit()">
  <label>Title:</label>
  <input formControlName="title">
  <br>
  <label>Author:</label>
  <input formControlName="author">
  <br>
  <button type="submit">{{ bookId ? 'Update' : 'Create' }}</button>
</form>




<!-- CSS intégré directement -->
<style>
/* Conteneur global du formulaire */
form {
  max-width: 400px;
  margin: 20px auto;
  padding: 20px;
  border: 2px solid #4caf50;
  border-radius: 10px;
  background-color: #f9f9f9;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  font-family: Arial, sans-serif;
}

/* Titres */
h2 {
  text-align: center;
  color: #4caf50;
  margin-bottom: 20px;
}

/* Labels */
label {
  display: block;
  font-weight: bold;
  margin-bottom: 5px;
  color: #333;
}

/* Inputs */
input {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 15px;
  border: 1px solid #ccc;
  border-radius: 5px;
  box-sizing: border-box;
  font-size: 14px;
}

/* Boutons */
button {
  width: 100%;
  padding: 10px;
  background-color: #4caf50;
  color: white;
  font-weight: bold;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 16px;
  transition: background-color 0.3s ease;
}

button:hover {
  background-color: #45a049;
}
</style>
